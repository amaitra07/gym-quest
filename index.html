<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym Quest">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Gym Quest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <main id="homeScreen">
      <header class="hero">
        <div>
          <h1 class="brand">GYM QUEST</h1>
          <p class="tagline">Every session earns XP. Every streak builds a legend.</p>
        </div>
        <button class="theme-toggle" id="themeButton" type="button" aria-label="Switch between light and dark theme">🌓</button>
      </header>

      <section class="panel level-card" aria-label="Your level">
        <div class="ring" aria-hidden="true">
          <svg width="78" height="78" viewBox="0 0 78 78">
            <circle class="ring-track" cx="39" cy="39" r="33"></circle>
            <circle class="ring-fill" id="ringFill" cx="39" cy="39" r="33"></circle>
          </svg>
          <div class="ring-label">
            <span class="ring-caption">LEVEL</span>
            <span class="ring-number" id="levelNumber">1</span>
          </div>
        </div>
        <div>
          <p class="level-title" id="levelTitle">Fresh Start</p>
          <p class="muted"><span id="xpIntoLevel">0</span> / <span id="xpForLevel">100</span> XP to next level</p>
        </div>
      </section>

      <div class="stat-row">
        <section class="panel stat" aria-label="Day streak">
          <span class="stat-number streak" id="streakNumber">0</span>
          <span class="muted">day streak</span>
        </section>
        <section class="panel stat" aria-label="Workouts logged">
          <span class="stat-number total" id="workoutCount">0</span>
          <span class="muted">workouts logged</span>
        </section>
      </div>

      <button class="primary-button start-button" id="startButton" type="button">Log workout</button>

      <section class="panel" aria-labelledby="calendarTitle">
        <div class="calendar-header">
          <button class="calendar-nav" id="calendarPrev" type="button" aria-label="Previous month">‹</button>
          <h2 id="calendarTitle"></h2>
          <button class="calendar-nav" id="calendarNext" type="button" aria-label="Next month">›</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div id="calendarDetails" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="historyHeading">
        <h2 id="historyHeading">Recent workouts</h2>
        <ul class="history" id="historyList"></ul>
        <p class="empty" id="historyEmpty" hidden>No workouts yet. Tap “Log workout” when you’re ready to log your first one.</p>
      </section>
    </main>

    <main id="workoutScreen" hidden></main>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
